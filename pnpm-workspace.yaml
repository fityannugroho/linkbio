packages:
  - '.'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
overrides:
  # @esbuild-kit (dead, used by drizzle-kit) pins esbuild ^0.18.20; force the version already in the tree
  '@esbuild-kit/core-utils>esbuild': 0.25.12
# pnpm 11 default 24h `minimumReleaseAge` gate; AWS SDK patches ship daily, so exempt them.
minimumReleaseAgeExclude:
  - '@aws-sdk/*'
  - '@smithy/*'
