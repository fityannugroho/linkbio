packages:
  - '.'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
overrides:
  # vinxi@0.5.11 pins h3 exactly at 1.15.3 (vulnerable); force minimal patched v1 release.
  # NOTE: must NOT be global — nitro@3-beta requires h3 v2 (2.0.1-rc) which is patched anyway.
  'vinxi>h3': 1.15.11
  # @tanstack/devtools peer resolution sticks to solid-js 1.9.10 which pulls seroval 1.3.2 (vulnerable);
  # 1.9.14 natively uses seroval ~1.5.4 (patched)
  solid-js: 1.9.14
  # @esbuild-kit (dead, used by drizzle-kit) pins esbuild ^0.18.20; force the version already in the tree
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # --- security overrides (audit 2026-10-10) ---
  # better-auth > solid-js > seroval-plugins resolves seroval 1.5.6 (GHSA-p6vx-979v-rg4c, GHSA-jp82-f5mq-hwhp);
  # no parent range reaches 1.6.3+, so pin globally. seroval 1.6.9 is the latest patch.
  seroval: ^1.6.9
  # launch-editor (via @tanstack/devtools-vite) pins shell-quote 1.10.0 (GHSA-pqg4-j6r4-53mv); dev-only.
  shell-quote: ^1.11.0
  # postcss 8.5.x (pulled by vite 8.3.4) resolves source-map-js 1.2.1 (GHSA-68fv-2mgg-jv7q);
  # css-tree pulled by jsdom 30 is stuck on the same range.
  'source-map-js': ^1.2.2
minimumReleaseAgeExclude:
  # dependency-upgrade picks younger than the 24h policy window
  - '@aws-sdk/checksums@3.1001.2'
  - '@aws-sdk/client-s3@3.1149.0'
  - '@aws-sdk/core@3.978.2'
  - '@aws-sdk/credential-provider-env@3.972.73'
  - '@aws-sdk/credential-provider-http@3.972.75'
  - '@aws-sdk/credential-provider-ini@3.973.18'
  - '@aws-sdk/credential-provider-login@3.972.80'
  - '@aws-sdk/credential-provider-node@3.972.85'
  - '@aws-sdk/credential-provider-process@3.972.73'
  - '@aws-sdk/credential-provider-sso@3.973.17'
  - '@aws-sdk/credential-provider-web-identity@3.972.79'
  - '@aws-sdk/middleware-sdk-s3@3.972.78'
  - '@aws-sdk/nested-clients@3.997.47'
  - '@aws-sdk/s3-request-presigner@3.1149.0'
  - '@aws-sdk/signature-v4-multi-region@3.996.48'
  - '@aws-sdk/token-providers@3.1149.0'
  - '@tanstack/history@1.162.5'
  - '@tanstack/react-router@1.170.42'
  - '@tanstack/react-start-client@1.168.40'
  - '@tanstack/react-start-rsc@0.1.60'
  - '@tanstack/react-start@1.168.61'
  - '@tanstack/react-start-server@1.167.47'
  - '@tanstack/router-core@1.171.35'
  - '@tanstack/router-generator@1.167.41'
  - '@tanstack/router-plugin@1.168.43'
  - '@tanstack/start-client-core@1.170.35'
  - '@tanstack/start-plugin-core@1.171.50'
  - '@tanstack/start-server-core@1.169.40'
  - '@tanstack/start-storage-context@1.167.37'
  - '@types/node@26.6.5'
  - 'dotenv@18.0.7'
  - 'lucide-react@1.55.0'
  - 'prettier@3.9.10'
